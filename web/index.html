<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baby Race</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Press+Start+2P&display=swap">
  <style>
    body {
      box-sizing: border-box;
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      font-family: "Press Start 2P", monospace;
      color: #fff;
      /* An ice-blue arena with a dusting of snow. */
      background:
        radial-gradient(rgba(255, 255, 255, 0.18) 1px, transparent 1.5px) 0 0 / 24px 24px,
        linear-gradient(160deg, #0b1f4d 0%, #1d4ed8 55%, #38bdf8 100%) fixed;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 6.5vw, 4.5rem);
      line-height: 1.2;
      text-align: center;
      color: #ffd23f;
      text-shadow: 0.06em 0.06em 0 #e63946, 0.12em 0.12em 0 #0b1f4d;
    }
    /* The game box: the shape of the rink, 712 x 240 pixels, framed like the
       boards with a red stripe. */
    #stage {
      position: relative;
      display: grid;
      place-items: center;
      width: min(1100px, 100% - 24px);
      aspect-ratio: 712 / 240;
      overflow: hidden;
      border: 6px solid #f8fafc;
      border-radius: 16px;
      box-shadow: 0 0 0 6px #e63946, 0 20px 50px rgba(0, 0, 0, 0.45);
      background: #0b1f4d;
      color: #ffd23f;
      font-size: clamp(0.7rem, 1.8vw, 1.1rem);
    }
    /* The game sits over the "Loading..." message and hides it once it draws. */
    #stage iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      visibility: hidden;
    }
    /* Who won, flashing over the end of the play: a girl for Team A, a boy
       for Team B. */
    #announce {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      font-family: "Luckiest Guy", cursive;
      font-size: clamp(1.75rem, 8vw, 5.5rem);
      letter-spacing: 0.04em;
      -webkit-text-stroke: 0.06em #0b1f4d;
      paint-order: stroke fill;
      text-shadow: 0.07em 0.07em 0 #0b1f4d;
    }
    #announce span {
      transform: rotate(-4deg);
    }
    #announce.girl {
      color: #ff6fb5;
    }
    #announce.boy {
      color: #4cc9f0;
    }
    .blink {
      animation: blink 1s steps(2, jump-none) infinite;
    }
    #announce .blink {
      animation-duration: 0.6s;
    }
    @keyframes blink {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    /* The seed box and the Play button, side by side. */
    #controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    #seed {
      box-sizing: border-box;
      width: 9em;
      font: inherit;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      padding: 0.9em 0.8em;
      color: #0b1f4d;
      background: #f8fafc;
      border: 0;
      border-radius: 12px;
      box-shadow: inset 0 4px 0 rgba(11, 31, 77, 0.25), 0 12px 24px rgba(0, 0, 0, 0.35);
    }
    #seed::placeholder {
      color: #64748b;
    }
    #seed:focus-visible {
      outline: 4px solid #ffd23f;
      outline-offset: 6px;
    }
    button {
      font: inherit;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      padding: 0.9em 2em;
      color: #fff;
      background: #e63946;
      border: 0;
      border-radius: 12px;
      box-shadow: 0 6px 0 #9b1c27, 0 12px 24px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s;
    }
    button:hover {
      background: #f25260;
    }
    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #9b1c27, 0 6px 12px rgba(0, 0, 0, 0.35);
    }
    button:focus-visible {
      outline: 4px solid #ffd23f;
      outline-offset: 6px;
    }
    @media (prefers-reduced-motion: reduce) {
      .blink {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <h1>Baby Race</h1>
  <div id="stage"><span class="blink">Press Play!</span></div>
  <form id="controls">
    <input id="seed" type="text" inputmode="numeric" pattern="-?[0-9]+"
           placeholder="Seed" aria-label="Seed" autocomplete="off"
           title="A whole number. Leave it empty to seed the play with the time.">
    <button id="play" type="submit">Play</button>
  </form>
<script>
  const stage = document.getElementById("stage");

  // pygbag's page around the game: see-through, so this page's "Loading..."
  // shows until the game draws. The game fills the box, which is already the
  // rink's shape (pygbag can size it before it knows the shape), scaled up
  // with pixelated so the pixel art stays sharp rather than blurred.
  const gameStyle = `
    body { background: transparent !important; }
    #transfer, #infobox { display: none !important; }
    canvas {
      width: 100% !important;
      height: 100% !important;
      image-rendering: pixelated !important;
    }
  `;

  // This page is published at the top of the site and again in red/, where
  // Team A always wins, and blue/, where Team B always wins (see
  // .github/workflows/pages.yml). They all play the one game, in game/.
  const folder = new URL(".", location.href).pathname.split("/").at(-2);
  const winner = {red: "A", blue: "B"}[folder];
  const gamePage = winner ? "../game/index.html" : "game/index.html";
  const seedBox = document.getElementById("seed");

  // Each play loads the game afresh, with the seed in the box if there is one
  // (the box only lets whole numbers through). With the box empty, the game
  // seeds itself with the time it starts.
  document.getElementById("controls").addEventListener("submit", (event) => {
    event.preventDefault();
    const query = new URLSearchParams();
    if (seedBox.value) query.set("seed", seedBox.value);
    if (winner) query.set("winner", winner);
    const game = document.createElement("iframe");
    game.title = "Hockey animation";
    game.src = query.toString() ? `${gamePage}?${query}` : gamePage;
    game.addEventListener("load", () => {
      const style = game.contentDocument.createElement("style");
      style.textContent = gameStyle;
      game.contentDocument.head.append(style);
      game.style.visibility = "visible";
    });
    const loading = document.createElement("span");
    loading.className = "blink";
    loading.textContent = "Loading...";
    stage.replaceChildren(loading, game);
  });

  // The game tells this page when a play starts, which SPACE in the game also
  // does, and who won once the puck is in the net (see tell_page() in main.py).
  const announce = document.createElement("div");
  announce.id = "announce";
  announce.setAttribute("role", "status");
  const words = document.createElement("span");
  words.className = "blink";
  announce.append(words);
  const announcements = {
    A: {words: "It's a Girl!", className: "girl"},
    B: {words: "It's a Boy!", className: "boy"},
  };

  window.addEventListener("message", (event) => {
    const game = stage.querySelector("iframe");
    if (!game || event.source !== game.contentWindow) return;
    if (event.data === "play") {
      announce.remove();
    } else if (typeof event.data === "string" && event.data.startsWith("won ")) {
      const announcement = announcements[event.data.slice(4)];
      if (!announcement) return;
      words.textContent = announcement.words;
      announce.className = announcement.className;
      stage.append(announce);
    }
  });
</script>
</body>
</html>
