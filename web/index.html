<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hockey Race!</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <style>
    body {
      box-sizing: border-box;
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      font-family: "Press Start 2P", monospace;
      color: #fff;
      /* An ice-blue arena with a dusting of snow. */
      background:
        radial-gradient(rgba(255, 255, 255, 0.18) 1px, transparent 1.5px) 0 0 / 24px 24px,
        linear-gradient(160deg, #0b1f4d 0%, #1d4ed8 55%, #38bdf8 100%) fixed;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 6.5vw, 4.5rem);
      line-height: 1.2;
      text-align: center;
      color: #ffd23f;
      text-shadow: 0.06em 0.06em 0 #e63946, 0.12em 0.12em 0 #0b1f4d;
    }
    /* The game box: the shape of the rink, 712 x 240 pixels, framed like the
       boards with a red stripe. */
    #stage {
      position: relative;
      display: grid;
      place-items: center;
      width: min(1100px, 100% - 24px);
      aspect-ratio: 712 / 240;
      overflow: hidden;
      border: 6px solid #f8fafc;
      border-radius: 16px;
      box-shadow: 0 0 0 6px #e63946, 0 20px 50px rgba(0, 0, 0, 0.45);
      background: #0b1f4d;
      color: #ffd23f;
      font-size: clamp(0.7rem, 1.8vw, 1.1rem);
    }
    /* The game sits over the "Loading..." message and hides it once it draws. */
    #stage iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      visibility: hidden;
    }
    .blink {
      animation: blink 1s steps(2, jump-none) infinite;
    }
    @keyframes blink {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    button {
      font: inherit;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      padding: 0.9em 2em;
      color: #fff;
      background: #e63946;
      border: 0;
      border-radius: 12px;
      box-shadow: 0 6px 0 #9b1c27, 0 12px 24px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s;
    }
    button:hover {
      background: #f25260;
    }
    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #9b1c27, 0 6px 12px rgba(0, 0, 0, 0.35);
    }
    button:focus-visible {
      outline: 4px solid #ffd23f;
      outline-offset: 6px;
    }
    @media (prefers-reduced-motion: reduce) {
      .blink {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <h1>Hockey Race!</h1>
  <div id="stage"><span class="blink">Press Play!</span></div>
  <button id="play" type="button">Play</button>
<script>
  const stage = document.getElementById("stage");

  // pygbag's page around the game: see-through, so this page's "Loading..."
  // shows until the game draws. The game fills the box, which is already the
  // rink's shape (pygbag can size it before it knows the shape), scaled up
  // with pixelated so the pixel art stays sharp rather than blurred.
  const gameStyle = `
    body { background: transparent !important; }
    #transfer, #infobox { display: none !important; }
    canvas {
      width: 100% !important;
      height: 100% !important;
      image-rendering: pixelated !important;
    }
  `;

  // This page is published at the top of the site and again in red/, where
  // Team A always wins, and blue/, where Team B always wins (see
  // .github/workflows/pages.yml). They all play the one game, in game/.
  const folder = new URL(".", location.href).pathname.split("/").at(-2);
  const winner = {red: "A", blue: "B"}[folder];
  const gameAddress = winner ? `../game/index.html?winner=${winner}` : "game/index.html";

  // Each play loads the game afresh. It seeds itself with the time it starts.
  document.getElementById("play").addEventListener("click", () => {
    const game = document.createElement("iframe");
    game.title = "Hockey animation";
    game.src = gameAddress;
    game.addEventListener("load", () => {
      const style = game.contentDocument.createElement("style");
      style.textContent = gameStyle;
      game.contentDocument.head.append(style);
      game.style.visibility = "visible";
    });
    const loading = document.createElement("span");
    loading.className = "blink";
    loading.textContent = "Loading...";
    stage.replaceChildren(loading, game);
  });
</script>
</body>
</html>
